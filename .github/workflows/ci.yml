name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CMAKE_BUILD_TYPE: Release

jobs:
  linux:
    name: Linux ${{ matrix.compiler }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: gcc
            c_compiler: gcc
            cxx_compiler: g++
            cuda_host_compiler: g++
            cuda_flags: ""
          - compiler: clang
            c_compiler: clang
            cxx_compiler: clang++
            cuda_host_compiler: clang++
            cuda_flags: --allow-unsupported-compiler

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Linux CI image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          tags: splatlib-ci:${{ matrix.compiler }}
          load: true
          pull: true
          cache-from: type=gha,scope=splatlib-linux-ci
          cache-to: type=gha,mode=max,scope=splatlib-linux-ci

      - name: Configure
        shell: bash
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -v "${GITHUB_WORKSPACE}:/workspace" \
            -w /workspace \
            splatlib-ci:${{ matrix.compiler }} \
            cmake -S . -B build/linux-${{ matrix.compiler }} -G Ninja \
              -DCMAKE_BUILD_TYPE=${{ env.CMAKE_BUILD_TYPE }} \
              -DCMAKE_C_COMPILER=${{ matrix.c_compiler }} \
              -DCMAKE_CXX_COMPILER=${{ matrix.cxx_compiler }} \
              -DCMAKE_CUDA_COMPILER=/usr/local/cuda/bin/nvcc \
              -DCMAKE_CUDA_HOST_COMPILER=${{ matrix.cuda_host_compiler }} \
              -DCMAKE_CUDA_FLAGS=${{ matrix.cuda_flags }} \
              -DBUILD_SPLAT_CAPI=ON \
              -DBUILD_SPLAT_PYTON_BINDING=OFF \
              -DBUILD_SPLAT_TRANSFORM_TOOL=OFF \
              -DBUILD_SPLAT_VIEWER=OFF \
              -DBUILD_SPLAT_TESTS=OFF

      - name: Build
        shell: bash
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -v "${GITHUB_WORKSPACE}:/workspace" \
            -w /workspace \
            splatlib-ci:${{ matrix.compiler }} \
            cmake --build build/linux-${{ matrix.compiler }} --parallel

      - name: Install
        shell: bash
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -v "${GITHUB_WORKSPACE}:/workspace" \
            -w /workspace \
            splatlib-ci:${{ matrix.compiler }} \
            cmake --install build/linux-${{ matrix.compiler }} --prefix /tmp/splatlib-install-${{ matrix.compiler }}

  macos:
    name: macOS Apple Silicon
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          brew install cmake ninja eigen nlohmann-json abseil webp zlib

      - name: Configure
        run: |
          cmake -S . -B build/macos -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ env.CMAKE_BUILD_TYPE }} \
            -DSPLAT_USE_CUDA=OFF \
            -DSPLAT_USE_METAL=ON \
            -DBUILD_SPLAT_CAPI=ON \
            -DBUILD_SPLAT_PYTON_BINDING=OFF \
            -DBUILD_SPLAT_TRANSFORM_TOOL=OFF \
            -DBUILD_SPLAT_VIEWER=OFF \
            -DBUILD_SPLAT_TESTS=OFF

      - name: Build
        run: cmake --build build/macos --parallel

      - name: Install
        run: cmake --install build/macos --prefix /tmp/splatlib-install-macos

  windows:
    name: Windows MSVC
    runs-on: [self-hosted, windows, x64, cuda]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Restore vcpkg cache
        uses: actions/cache@v4
        with:
          path: |
            vcpkg/downloads
            vcpkg/packages
            vcpkg/installed
          key: vcpkg-windows-x64-${{ hashFiles('.github/workflows/ci.yml', 'CMakeLists.txt', 'src/CMakeLists.txt') }}
          restore-keys: |
            vcpkg-windows-x64-

      - name: Bootstrap vcpkg
        shell: pwsh
        run: |
          if (-not (Test-Path vcpkg)) {
            git clone https://github.com/microsoft/vcpkg.git
          }
          .\vcpkg\bootstrap-vcpkg.bat -disableMetrics

      - name: Install dependencies
        shell: pwsh
        run: |
          .\vcpkg\vcpkg.exe install `
            eigen3 `
            nlohmann-json `
            abseil `
            libwebp `
            zlib `
            --triplet x64-windows

      - name: Configure
        shell: pwsh
        run: |
          if (-not $env:CUDA_PATH) {
            throw "CUDA_PATH is not set. Use a Windows runner with CUDA preinstalled."
          }

          cmake -S . -B build\windows -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="${{ github.workspace }}\vcpkg\scripts\buildsystems\vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows `
            -DCMAKE_CUDA_COMPILER="$env:CUDA_PATH\bin\nvcc.exe" `
            -DBUILD_SPLAT_CAPI=ON `
            -DBUILD_SPLAT_PYTON_BINDING=OFF `
            -DBUILD_SPLAT_TRANSFORM_TOOL=OFF `
            -DBUILD_SPLAT_VIEWER=OFF `
            -DBUILD_SPLAT_TESTS=OFF

      - name: Build
        shell: pwsh
        run: |
          cmake --build build\windows --config $env:CMAKE_BUILD_TYPE --parallel

      - name: Install
        shell: pwsh
        run: |
          cmake --install build\windows --config $env:CMAKE_BUILD_TYPE --prefix "$env:RUNNER_TEMP\splatlib-install"
